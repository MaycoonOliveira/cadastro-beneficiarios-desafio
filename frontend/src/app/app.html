<nz-layout class="app-layout">
  <nz-sider class="menu-sidebar" nzCollapsible nzWidth="256px" nzBreakpoint="md" [(nzCollapsed)]="isCollapsed"
    [nzTrigger]="null">

    <div class="sidebar-logo">
      <a href="#">
        <span nz-icon nzType="medicine-box" nzTheme="fill"></span>
        <h1 *ngIf="!isCollapsed">Beneficiários e Planos</h1>
      </a>
    </div>

    <ul nz-menu nzTheme="light" nzMode="inline" [nzInlineCollapsed]="isCollapsed">

      <li nz-menu-item nzMatchRouter>
        <span nz-icon nzType="schedule"></span>
        <span><a routerLink="/planos">Planos</a></span>
      </li>

      <li nz-menu-item nzMatchRouter>
        <span nz-icon nzType="team"></span>
        <span><a routerLink="/beneficiarios">Beneficiários</a></span>
      </li>

    </ul>
  </nz-sider>

  <nz-layout>
    <nz-header>
      <div class="app-header">
        <span class="header-trigger" (click)="isCollapsed = !isCollapsed">
          <span nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"></span>
        </span>
      </div>
    </nz-header>

    <nz-content>
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
