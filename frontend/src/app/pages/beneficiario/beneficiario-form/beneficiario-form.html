<div style="padding: 24px; background: #f0f2f5; min-height: 100vh; display: flex; justify-content: center;">
  <nz-card [nzTitle]="titulo" style="width: 600px; margin-top: 40px;">

    <form nz-form [formGroup]="form" (ngSubmit)="salvar()" nzLayout="vertical">

      <nz-form-item>
        <nz-form-label nzRequired>Nome Completo</nz-form-label>
        <nz-form-control nzErrorTip="Informe o nome completo">
          <input nz-input formControlName="nomeCompleto" placeholder="Ex: João da Silva" />
        </nz-form-control>
      </nz-form-item>

      <div style="display: flex; gap: 16px;">
        <nz-form-item style="flex: 1;">
          <nz-form-label nzRequired>CPF</nz-form-label>
          <nz-form-control nzErrorTip="Informe o CPF">
            <input nz-input formControlName="cpf" placeholder="000.000.000-00" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item style="flex: 1;">
          <nz-form-label nzRequired>Data de Nascimento</nz-form-label>
          <nz-form-control nzErrorTip="Informe a data">
            <nz-date-picker formControlName="dataNascimento" style="width: 100%;"></nz-date-picker>
          </nz-form-control>
        </nz-form-item>
      </div>

      <nz-form-item>
        <nz-form-label>E-mail</nz-form-label>
        <nz-form-control nzErrorTip="E-mail inválido">
          <input nz-input formControlName="email" placeholder="exemplo@email.com" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Plano de Saúde</nz-form-label>
        <nz-form-control nzErrorTip="Selecione um plano">
          <nz-select formControlName="planoId" nzPlaceHolder="Selecione um plano">
            <nz-option *ngFor="let plano of listaPlanos" [nzValue]="plano.id"
              [nzLabel]="plano.nome + ' (ANS: ' + plano.codigo_registro_ans + ')'">
            </nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
        <button nz-button type="button" routerLink="/beneficiarios">Cancelar</button>
        <button nz-button nzType="primary" [nzLoading]="loading" type="submit">Salvar</button>
      </div>

    </form>
  </nz-card>
</div>
